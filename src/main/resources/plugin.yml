name: SimpleCombat
version: 1.5
main: me.combat.SimpleCombatPlugin
api-version: '1.13'
folia-supported: true
author: NothingFlare
description: Universal Simple Combat Tagging Plugin with Multi-Language BossBar and Anti-Relog

commands:
  simplecombat:
    description: Main Simple Combat command
    aliases: [combat, combattag, sc, cb, ct]
    usage: /simplecombat [status|reload|tag|untag]

permissions:
  simplecombat.admin:
    description: Allows reloading config and tagging/untagging players
    default: op
  combat.admin:
    description: Legacy alias for simplecombat.admin
    default: op
  simplecombat.bypass:
    description: Complete bypass of combat tagging
    default: false
  combat.bypass:
    description: Legacy alias for simplecombat.bypass
    default: false
  simplecombat.bypass.commands:
    description: Allows using blocked commands during combat
    default: false
  combat.bypass.commands:
    description: Legacy alias for simplecombat.bypass.commands
    default: false
  simplecombat.bypass.teleport:
    description: Allows teleporting during combat
    default: false
  combat.bypass.teleport:
    description: Legacy alias for simplecombat.bypass.teleport
    default: false
  simplecombat.bypass.flight:
    description: Allows flying during combat
    default: false
  combat.bypass.flight:
    description: Legacy alias for simplecombat.bypass.flight
    default: false
  simplecombat.bypass.quit:
    description: Prevents being killed when logging out in combat
    default: false
  combat.bypass.quit:
    description: Legacy alias for simplecombat.bypass.quit
    default: false
