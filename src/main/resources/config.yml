# =======================================================
#           Simple Combat Plugin Configuration
# =======================================================

# Language / Язык плагина
# Supported: en, ru, zh, de, fr, es, pt, ja, uk, it, pl, tr, ko
language: "ru"

# Combat duration in seconds / Длительность боя в секундах
combat-seconds: 20

# BossBar configuration / Настройка полосы босса
bossbar:
  enabled: true
  # Available colors: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
  color: RED
  # Available styles: SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
  style: SOLID

# Kill player on disconnect during combat / Убивать игрока при выходе во время боя
punish-on-quit: true

# Broadcast message when player disconnects during combat / Оповещать сервер о выходе
broadcast-on-quit: true

# Remove combat tag when opponent is killed / Снимать бой после убийства противника
remove-combat-on-kill: true

# Remove combat tag on death / Снимать бой после смерти игрока
remove-combat-on-death: true

# Block ender pearl and chorus fruit teleports during combat / Блокировать телепортацию жемчугом/хорусом
block-teleport: true

# Disable flight when entering combat / Отключать полет при входе в бой
disable-flight: true

# Enable bypass permission 'combat.bypass' / Включить право на обход боя (combat.bypass)
# If false, all players (including OPs and admins with '*') enter combat
# Если false, все игроки (включая OP и игроков с '*') входят в бой при ударе
enable-bypass: false

# Allow combat tagging in creative mode / Входить в бой в режиме креатива
tag-creative: false

# Excluded worlds configuration / Настройка миров-исключений
# Players in excluded worlds will not enter combat state
# В указанных мирах режим боя не активируется
excluded-worlds:
  # Enable world exclusion feature / Включить функцию миров-исключений
  enabled: false
  # List of world names / Список названий миров
  worlds:
    - "spawn"
    - "hub"

# Commands configuration / Настройка команд
commands:
  # If false, commands below are blocked (blacklist). If true, only commands below are allowed (whitelist).
  whitelist-mode: false
  # Blocked commands list / Список заблокированных команд
  list:
    - "tp"
    - "tpa"
    - "tpaccept"
    - "tpacancel"
    - "tpahere"
    - "tpall"
    - "tpauto"
    - "tpaall"
    - "tpask"
    - "teleport"
    - "home"
    - "sethome"
    - "delhome"
    - "homes"
    - "spawn"
    - "warp"
    - "back"
    - "rtp"
    - "tpr"
    - "wild"
    - "call"
    - "tpo"
    - "fly"
    - "gm"
    - "gamemode"
    - "heal"
    - "feed"
    - "god"
    - "vanish"
    - "v"
    - "suicide"
